name: Build and Push Heavy Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Alokasikan disk space ke working directory (/home/runner/work)
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          root-reserve-mb: 512
          swap-size-mb: 512

      # 2. Pindahkan /var/lib/docker secara fisik ke partisi 103GB (/home/runner/work)
      - name: Move Docker Root to 103GB Partition
        run: |
          sudo service docker stop
          sudo mkdir -p /home/runner/work/docker-data
          if [ -d /var/lib/docker ]; then
            sudo mv /var/lib/docker/* /home/runner/work/docker-data/ 2>/dev/null || true
            sudo rm -rf /var/lib/docker
          fi
          sudo ln -s /home/runner/work/docker-data /var/lib/docker
          sudo service docker start
          df -h

      # 3. Checkout Kode Project
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build & Push Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sujinwo555/movie-recap:v1
